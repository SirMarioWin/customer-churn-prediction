[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "0.1.0"
description = "A reproducible baseline for Telco customer churn classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
churn-predict = "churn_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

target-version = "py310"
